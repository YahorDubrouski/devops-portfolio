name: observability-loki

services:
  loki:
    image: grafana/loki:2.9.8
    user: "0"
    mem_limit: 1g
    labels:
      observability: "1"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      observability:
        aliases: [loki]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    mem_limit: 256m
    labels:
      observability: "1"
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    environment:
      NODE_NAME: local
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/promtail
    networks:
      observability:
        aliases: [promtail]
    restart: unless-stopped

networks:
  observability:
    external: true
    name: observability

volumes:
  loki_data:
  promtail_positions:
