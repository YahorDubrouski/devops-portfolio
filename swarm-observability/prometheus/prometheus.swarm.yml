global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Task discovery instead of overlay DNS. Each series gets the node hostname,
# not a short-lived overlay IP. Prometheus must mount the Docker socket and
# run on a manager. See prometheus/docker-compose.yaml for the local file,
# which uses the same label names over Compose DNS.

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus_prometheus:9090']

  - job_name: cadvisor
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: prometheus_cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_task_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: observability
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:8080'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_swarm_service_name]
        regex: (.+)
        target_label: service
      - source_labels: [container_label_com_docker_stack_namespace]
        regex: (.+)
        target_label: stack
      - source_labels: [container_label_com_docker_swarm_task_name]
        regex: (.+)
        target_label: container
      - regex: 'container_label_com_docker_.*|id|name'
        action: labeldrop

  - job_name: node-exporter
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_service_name]
        regex: prometheus_node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_task_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_network_name]
        regex: observability
        action: keep
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '$1:9100'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
